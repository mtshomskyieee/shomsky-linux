[package]
name = "quickyn"
version = "0.1.0"
edition = "2021"
description = "Yes/no decision CLI with confidence for Shomsky Linux"
license = "MIT"
rust-version = "1.74"

[[bin]]
name = "quickyn"
path = "src/bin/quickyn.rs"

[lib]
name = "quickyn"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
