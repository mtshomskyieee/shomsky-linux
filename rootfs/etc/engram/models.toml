# Model registry for Shomsky Linux.
# Selected with SHOMSKY_MODEL=<alias> (default: mistral).
# Weights are downloaded on first run into /engram/models — never baked into the image.

[models.mistral]
description = "Mistral 7B Instruct v0.2 GGUF Q4_K_M (default)"
repo = "TheBloke/Mistral-7B-Instruct-v0.2-GGUF"
filename = "mistral-7b-instruct-v0.2.Q4_K_M.gguf"
# Leave sha256 empty to skip verification (filled when pinning a known revision).
sha256 = ""
# Optional HF id for tokenizer when the GGUF has none embedded
tok_model_id = ""
license = "Apache-2.0"
# Approximate download size in bytes (for progress messaging)
size_hint = 4369000000

