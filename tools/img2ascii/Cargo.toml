[package]
name = "img2ascii"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone tool — not a workspace member (see root Cargo.toml exclude).
[workspace]

[[bin]]
name = "img2ascii"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
